name: tick
# Alle 30 Minuten startet ein Lauf, der bis zu 28 Minuten alle 5 Minuten handelt. Zeiten in UTC, deckt Sommer und Winter ab.
on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch:
concurrency:
  group: tick
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Handeln
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash cloud-loop.sh
