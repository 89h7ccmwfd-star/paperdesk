name: tick
# GitHub startet geplante Laeufe oft spaet oder gar nicht. Deshalb viele Startversuche ab vor Boersenstart; der erste, der laeuft, bleibt bis Boersenschluss. Zeiten in UTC, Sommer und Winter.
on:
  schedule:
    - cron: "*/15 12-20 * * 1-5"
  workflow_dispatch:
    inputs:
      replay:
        description: "Nur Test: Tag JJJJ-MM-TT nachspielen, ohne zu speichern"
        required: false
concurrency:
  group: tick
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
  issues: write
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        if: ${{ inputs.replay != '' }}
        env:
          DAY: ${{ inputs.replay }}
        run: |
          T=$(mktemp -d); mkdir -p "$T/site"
          python3 -c "import json,sys; d=json.load(open('site/state.json')); [a.update(cash=10000,equity=10000,realizedPnl=0,positions=[],journal=[]) for a in d['accounts'].values()]; d.pop('decisions',0); d.pop('inPlay',0); json.dump(d,open(sys.argv[1]+'/site/state.json','w'))" "$T"
          for w in 09:36 09:41 10:01 10:36 15:56; do PAPER_HOME="$T" PAPER_NOW="$DAY $w" python3 paper.py tick --no-publish; done
          python3 -c "import json,sys; d=json.load(open(sys.argv[1]+'/site/state.json')); print(d.get('inPlay',{}).get('scanned'), d.get('inPlay',{}).get('matches')); print([(j['action'],j['symbol'],j['price'],j.get('pnl')) for a in d['accounts'].values() for j in a['journal']]); print([x['detail'][:70] for x in d.get('decisions',[])][-5:])" "$T"
      - name: Handeln
        if: ${{ inputs.replay == '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: bash cloud-loop.sh
      - name: Fehler melden
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Bot-Lauf fehlgeschlagen" --body "Lauf ${{ github.run_id }} ist mit Fehler beendet: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
